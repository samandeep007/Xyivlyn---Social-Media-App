services:
  postgres:
    image: postgres:17-alpine
    container_name: rsd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rsd
      POSTGRES_PASSWORD: rsd_dev_password
      POSTGRES_DB: rsd
    ports:
      - "5432:5432"
    volumes:
      - rsd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsd -d rsd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rsd_postgres_data:
